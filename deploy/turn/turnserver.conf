# coturn configuration for Deskstream.
# Secrets and host-specific values (static-auth-secret, realm, external-ip) are passed on the
# command line from .env by docker-compose.yml, so this file contains nothing sensitive.

# Ports: 3478 (STUN/TURN over UDP+TCP) and 5349 (TURN over TLS, for networks that block UDP).
listening-port=3478
tls-listening-port=5349

# Relay port range. Open exactly this UDP range in the firewall.
min-port=49160
max-port=49200

# Authentication: the TURN REST API ("use-auth-secret"). Deskstream's server derives short-lived
# credentials from the same shared secret (TURN_SECRET), so no static passwords exist.
use-auth-secret
fingerprint

# TLS certificate for turns: (mounted from the host, e.g. Let's Encrypt).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Security: never relay into private, loopback or link-local networks (prevents using the relay
# to reach services behind your firewall), and disable the admin CLI.
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits: sessions per user and in total, and short nonce lifetime.
user-quota=12
total-quota=1200
stale-nonce=600

# Logs to stdout for `docker compose logs`.
log-file=stdout
simple-log
